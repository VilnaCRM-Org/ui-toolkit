name: performance testing

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-storybook:
    name: build storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start docker test environment
        run: make start-bun

      - name: Build Storybook
        run: make storybook-build

      - name: Export the Storybook build
        run: make copy-storybook-static

      - name: Upload the Storybook build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: storybook-static/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - name: Stop docker test environment
        if: always()
        run: make down

  performance:
    name: lighthouse ${{ matrix.formFactor }} ${{ matrix.shard }}
    needs: build-storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        formFactor: [desktop, mobile]
        shard: [1, 2, 3]
    env:
      CI: true
      INSTALL_CHROMIUM: 'true'
      LHCI_SHARD_COUNT: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Storybook build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storybook-static
          path: storybook-static/

      - name: Start docker test environment
        run: make start-bun

      - name: Load the Storybook build into the container
        run: make load-storybook-static

      - name: Run ${{ matrix.formFactor }} Lighthouse audit, shard ${{ matrix.shard }}
        run: make lighthouse-${{ matrix.formFactor }} LHCI_SHARD=${{ matrix.shard }}/$LHCI_SHARD_COUNT

      - name: Export the Lighthouse results
        if: always()
        run: make copy-lighthouse-reports

      - name: Upload the Lighthouse results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-${{ matrix.formFactor }}-${{ matrix.shard }}
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: Stop docker test environment
        if: always()
        run: make down
