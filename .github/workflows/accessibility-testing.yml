name: accessibility testing

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare result directories
        run: mkdir -p playwright-report && sudo chown 1000:1000 playwright-report

      - name: Install dependencies
        run: make install

      - name: Run accessibility tests
        run: make test-a11y PLAYWRIGHT_RUN_FLAGS="--volume $GITHUB_WORKSPACE/playwright-report:/app/playwright-report"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: a11y-report
          path: playwright-report/
          retention-days: 30
