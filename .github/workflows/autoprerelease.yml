name: generate changelog and create pre release

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - 'package.json'
      - 'CHANGELOG.md'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@8118086024a5380b05b0d54ed2181516082e090f # v4.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file: 'false'
          version-file: 'package.json'
          pre-release: 'true'
          git-push: 'false'
          skip-commit: 'true'
          skip-tag: 'true'
