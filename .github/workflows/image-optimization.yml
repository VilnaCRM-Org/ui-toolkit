name: Image optimization

on:
  pull_request:
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.webp'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: calibreapp/image-actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compress Images
        uses: calibreapp/image-actions@9d037c06280028c110ff61c433ad4dc7d33c3c43 # v1.5.0
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # Playwright baselines are test fixtures compared at zero pixel tolerance,
          # not shipped assets. Lossy recompression silently rewrites a handful of
          # their pixels and the visual suite then fails against its own baseline —
          # which is exactly what happened to the link and toolbar snapshots.
          ignorePaths: 'tests/visual/**'
