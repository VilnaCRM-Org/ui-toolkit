name: release provenance

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Start docker build environment
        run: make start-bun

      - name: Pack the publishable tarball from the release tag
        run: make package

      - name: Fail on a licence, IP or secret finding in the tarball
        run: make lint-licenses

      - name: Attest build provenance for the release tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tgz'

      - name: Replace the release asset with the attested tarball
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          tarballs=(dist/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one tarball in dist/, found ${#tarballs[@]}"
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${tarballs[0]}" --clobber

      - name: Stop docker build environment
        if: always()
        run: make down
