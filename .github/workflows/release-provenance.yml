name: release provenance

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start docker build environment
        run: make start-bun

      - name: Pack the publishable tarball from the release tag
        run: make package

      - name: Fail on a licence, IP or secret finding in the tarball
        run: make lint-licenses

      - name: Attest build provenance for the release tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tgz'

      - name: Verify the published release asset matches the attested tarball
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/ci/verify-release-asset.sh "$RELEASE_TAG" dist

      - name: Stop docker build environment
        if: always()
        run: make down
