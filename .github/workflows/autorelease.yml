name: generate changelog and create release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'package.json'
      - 'CHANGELOG.md'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Verify the release App credentials are available
        env:
          APP_ID: ${{ secrets.VILNACRM_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.VILNACRM_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::VILNACRM_APP_ID and VILNACRM_APP_PRIVATE_KEY must be" \
              "visible to this repository. They are organisation secrets. Grant" \
              "this repository access to both before re-running."
            exit 1
          fi

      - name: Generate a token for the release App
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VILNACRM_APP_ID }}
          private-key: ${{ secrets.VILNACRM_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release version cannot collide with an existing tag
        run: bash scripts/ci/check-release-version.sh .

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@8118086024a5380b05b0d54ed2181516082e090f # v4.1.0
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          output-file: 'CHANGELOG.md'
          version-file: 'package.json'
          git-push: false

      - name: Push the release commit, then its tag
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          RELEASE_TOKEN: ${{ steps.generate_token.outputs.token }}
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          APP_SLUG: ${{ steps.generate_token.outputs.app-slug }}
        run: |
          set -euo pipefail

          remote="https://x-access-token:${RELEASE_TOKEN}@github.com/${REPOSITORY}.git"
          push_log="$RUNNER_TEMP/release-push.log"

          if ! git push "$remote" "HEAD:${GITHUB_REF}" 2> "$push_log"; then
            cat "$push_log" >&2
            if grep -q 'GH006' "$push_log"; then
              echo "::error::main's branch protection rule declined the release commit" \
                "(GH006). The release App '${APP_SLUG}' is not on that rule's bypass list," \
                "so no release can land until an admin adds it. Nothing was pushed and no" \
                "tag exists on the remote. Steps: issue #162"
            fi
            exit 1
          fi

          git push "$remote" "refs/tags/${RELEASE_TAG}"

      - name: Start docker build environment
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: make start-bun

      - name: Pack the publishable tarball
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: make package

      - name: Create Release
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.clean_changelog }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          tarballs=(dist/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one tarball in dist/, found ${#tarballs[@]};" \
              "the make package step did not produce the release asset"
            exit 1
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes"

          gh release create "$RELEASE_TAG" "${tarballs[0]}" \
            --title "$RELEASE_TAG" \
            --notes-file "$notes"

      - name: Stop docker build environment
        if: ${{ always() && steps.changelog.outputs.skipped == 'false' }}
        run: make down
