name: generate changelog and create release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'package.json'
      - 'CHANGELOG.md'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Dropped, like every other workflow in this repo. The changelog action
          # does NOT use the checkout credential: its `init()` rewrites `origin`
          # to https://x-access-token:<github-token>@... before it pulls, commits
          # or pushes, so it authenticates the version bump and the tag with the
          # token passed to it below. Persisting the checkout token here would
          # leave a contents:write credential in .git/config for the docker build
          # and `make package` steps that run after this job's release steps.
          persist-credentials: false

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@8118086024a5380b05b0d54ed2181516082e090f # v4.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file: 'CHANGELOG.md'
          version-file: 'package.json'

      # The changelog step bumps package.json in the working tree before the image
      # is built, so the packed tarball carries the version that is being released.
      - name: Start docker build environment
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: make start-bun

      - name: Pack the publishable tarball
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: make package

      - name: Create Release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          release_name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          files: dist/*.tgz

      - name: Stop docker build environment
        if: ${{ always() && steps.changelog.outputs.skipped == 'false' }}
        run: make down
