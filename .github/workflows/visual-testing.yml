name: Visual Tests

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare result directories
        run: mkdir -p test-results playwright-report && sudo chown 1000:1000 test-results playwright-report

      - name: Install dependencies
        run: make install

      - name: Run visual tests
        run: make test-visual PLAYWRIGHT_RUN_FLAGS="--volume $GITHUB_WORKSPACE/test-results:/app/test-results --volume $GITHUB_WORKSPACE/playwright-report:/app/playwright-report"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: visual-test-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: visual-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
