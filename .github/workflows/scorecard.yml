name: OSSF Scorecard

on:
  branch_protection_rule:
  push:
    branches:
      - main
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:

permissions: {}

# All three triggers resolve to the same ref on `main`, so cancelling would let
# a push discard the scheduled analysis (or the reverse). They queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload the findings to the repository's code-scanning dashboard.
      security-events: write
      # Publish the score to the OpenSSF REST API so the README badge resolves.
      id-token: write
      # Checkout only. `actions: read` is a private-repository scope and this
      # repository is public, so it is deliberately not granted.
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the Scorecard SARIF as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 90
          if-no-files-found: error

      - name: Upload the Scorecard SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
