name: static testing
on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start docker test environment
        run: make start-bun

      - name: Run ESLint
        run: make lint-next

      - name: Run tsc linter
        run: make lint-tsc

      - name: Run markdown linter
        run: make lint-md

      - name: Run code formatter
        run: make format-check

      - name: Run dependency range linter
        run: make lint-dep-ranges

      - name: Enforce test directory structure
        run: make lint-test-structure

      - name: Verify referenced Makefile and workflow paths exist
        run: make lint-ci-paths

      - name: Stop docker test environment
        if: always()
        run: make down
