name: static testing
on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start docker test environment
        run: make start-bun

      - name: Run ESLint
        run: make lint-next

      - name: Run tsc linter
        run: make lint-tsc

      - name: Run markdown linter
        run: make lint-md

      - name: Run code formatter
        run: make format-check

      - name: Run dependency range linter
        run: make lint-dep-ranges

      - name: Run unused dependency linter
        run: make lint-unused-deps

      - name: Enforce test directory structure
        run: make lint-test-structure

      - name: Verify referenced Makefile and workflow paths exist
        run: make lint-ci-paths

      # No workflow ran `make build` or `make package` before this step existed, so
      # the only thing that ever executed `build.config.mjs` was a release — and
      # releases were failing for unrelated reasons. A build-breaking change
      # therefore sat on main unnoticed until a release tried to pack the tarball.
      # This runs the real build, including the check that every generated subpath
      # `.d.ts` is backed by an export the emitted `.mjs` actually has.
      - name: Build the publishable bundle
        run: make build

      - name: Stop docker test environment
        if: always()
        run: make down
