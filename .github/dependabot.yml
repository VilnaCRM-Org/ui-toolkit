version: 2
updates:
  # Split the npm surface so a security advisory is never buried in the weekly
  # batch: version updates are grouped by dependency type, while security
  # updates stay ungrouped and therefore arrive as one reviewable PR each.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    reviewers:
      - 'Kravalg'
    groups:
      production-dependencies:
        applies-to: version-updates
        dependency-type: 'production'
        patterns:
          - '*'
      development-dependencies:
        applies-to: version-updates
        dependency-type: 'development'
        patterns:
          - '*'
    commit-message:
      prefix: 'feat'
      prefix-development: 'chore'
      include: 'scope'

  # Refreshes the SHA pins in .github/workflows so pinning stays maintainable
  # instead of rotting into stale, unpatched action code.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    reviewers:
      - 'Kravalg'
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
    commit-message:
      prefix: 'ci'
      include: 'scope'

  # Covers Dockerfile, Dockerfile.playwright and Dockerfile.rca so their
  # digest pins are refreshed by PR rather than by hand.
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    reviewers:
      - 'Kravalg'
    groups:
      docker-base-images:
        applies-to: version-updates
        patterns:
          - '*'
    commit-message:
      prefix: 'build'
      include: 'scope'
