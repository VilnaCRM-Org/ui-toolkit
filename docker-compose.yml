services:
  bun:
    build:
      context: .
      args:
        INSTALL_CHROMIUM: ${INSTALL_CHROMIUM:-false}
    restart: unless-stopped
  storybook:
    build: .
    # Serve a STATIC Storybook build (not `storybook dev`): the dev server's async
    # HMR lets toHaveScreenshot capture a stale in-transit frame, so baselines silently
    # drift from the live render. A static build renders deterministically on first paint.
    command:
      [
        'sh',
        '-lc',
        'bun x storybook build --output-dir /app/storybook-static --quiet && python3 -m http.server 6006 --bind 0.0.0.0 --directory /app/storybook-static',
      ]
  playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    environment:
      REACT_APP_STORYBOOK_URL: http://storybook:6006
    ipc: host
  rca:
    build:
      context: .
      dockerfile: Dockerfile.rca
    profiles:
      - tools
    volumes:
      - .:/app
